name: Hyperdrift tracker

on:
  schedule:
    - cron: "15 22 * * 1-5"      # weekdays 22:15 UTC = after the US market closes (5:15-6:15 pm ET)
  workflow_dispatch:              # also gives you a "Run workflow" button in the Actions tab

permissions:
  contents: write                 # lets the job save the CSV files back into your repo

concurrency: hyperdrift-tracker

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HISTORY_PATH: data/stock_ranker_history.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q pandas numpy requests lxml yfinance altair tzdata
      - name: Log picks, experts and live-trading results
        run: python tracker.py
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "hyperdrift-tracker"
          git config user.email "hyperdrift-tracker@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update tracker data" && git pull --rebase && git push)
