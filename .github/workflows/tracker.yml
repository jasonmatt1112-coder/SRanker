name: tracker

on:
  schedule:
    - cron: "37 21 * * 1-5"   # evening in New York (after the close), Mon-Fri
    - cron: "47 1 * * 2-6"    # backup run a few hours later
  workflow_dispatch:           # lets you start it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tracker.txt
      - run: pip install -r requirements-tracker.txt
      - run: python tracker.py --once
        env:
          HISTORY_PATH: data/stock_ranker_history.csv
      - name: Save results to the repo
        run: |
          git config user.name "stock-tracker"
          git config user.email "stock-tracker@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update history" && git pull --rebase && git push)
